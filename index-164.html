<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Worldbrush">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html{box-sizing:border-box;height:100%;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);background:#060a1a}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Worldbrush</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@500;600&display=swap">
<style>
/* Layout: the globe owns the whole screen; a paint-box dock sits under it, quiet controls float above it. Single dark look by choice (space). */
:root{
  color-scheme: dark;
  --space:#060a1a;
  --dock:#0d1430;
  --dock-hi:#18214a;
  --ink:#eaf0ff;
  --muted:#93a0cc;
  --line:rgba(150,175,255,.18);
  --glow:#7cc0ff;
  --warn:#ff8f7a;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --ui:"Figtree","Avenir Next","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{
  background:var(--space);color:var(--ink);font-family:var(--ui);font-size:14px;
  display:grid;grid-template-rows:minmax(0,1fr) auto;grid-template-columns:minmax(0,1fr);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
}
#stage{position:relative;min-height:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 45%,#0e1740 0%,var(--space) 62%)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .5s;
  background:radial-gradient(120% 90% at 50% 45%,#0a3a4a 0%,#04121c 66%);z-index:0}
body.sea #stage::after{opacity:1}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair;z-index:1}
body.spin #gl{cursor:grab}

#top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 16px;pointer-events:none;z-index:2}
#top > *{pointer-events:auto}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.pill{background:rgba(13,20,48,.78);border:1px solid var(--line);border-radius:999px;padding:8px 12px;
  font-weight:600;font-size:13px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill:disabled{opacity:.4;cursor:default}
#wname{display:flex;align-items:center;gap:6px;min-width:0;font-family:var(--display);font-weight:800;font-size:16px;
  letter-spacing:-.01em;padding:7px 12px 7px 14px}
#wlabel{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#wname svg{flex:none;opacity:.7}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.seg{display:flex;background:rgba(13,20,48,.78);border:1px solid var(--line);border-radius:999px;padding:3px;flex:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{padding:7px 12px;border-radius:999px;color:var(--muted);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#0a1030}

#bodyBtn{position:absolute;left:16px;top:60px;z-index:2;display:flex;align-items:center;gap:7px;padding:7px 12px 7px 9px}
#bodyBtn i{width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#e6e6ea,#8c8c94);box-shadow:inset -3px -2px 0 rgba(0,0,0,.25)}
body.moon #bodyBtn i{background:radial-gradient(circle at 35% 35%,#6fb0ff,#1a4fb4);box-shadow:inset -3px -2px 0 rgba(0,0,0,.2)}
#sndBtn{position:absolute;right:16px;top:60px;z-index:2;display:grid;place-items:center;padding:8px 10px}
#sndBtn .x{display:none} #sndBtn[aria-pressed="false"] .w{display:none} #sndBtn[aria-pressed="false"] .x{display:block} #sndBtn[aria-pressed="false"]{color:var(--muted)}
#gl{transition:opacity .16s}
#hint{position:absolute;left:16px;right:16px;bottom:14px;text-align:center;color:var(--ink);pointer-events:none;z-index:2;
  font-size:13px;line-height:1.4;text-shadow:0 1px 10px rgba(6,10,26,1);transition:opacity .6s;text-wrap:balance}
#hint.off{opacity:0}
#toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#0a1030;
  padding:8px 14px;border-radius:999px;font-weight:600;font-size:13px;opacity:0;transition:opacity .25s;z-index:9;
  pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}
#ring{position:absolute;left:0;top:0;border:1.5px solid rgba(255,255,255,.85);border-radius:50%;z-index:2;
  box-shadow:0 0 0 1px rgba(6,10,26,.5);pointer-events:none;transform:translate(-50%,-50%);opacity:0;transition:opacity .2s}
#ring.on{opacity:1}
#nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted);z-index:3}

#dock{min-width:0;overflow:hidden;background:var(--dock);border-top:1px solid var(--line);
  padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:12px;max-width:640px;width:100%;margin-inline:auto}
.row .seg{background:var(--space)}
.size{display:flex;align-items:center;gap:8px;flex:1;min-width:0;color:var(--muted);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase}
.row .seg button{padding-inline:9px}
@media (max-width:520px){.size span{display:none}}
.size input{flex:1;min-width:0;accent-color:var(--glow);height:28px}
.tools{display:flex;gap:2px;min-width:0;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:12px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:5px;padding:5px 0 3px;border-radius:14px;
  color:var(--muted);font-size:11px;font-weight:600}
.tool:first-child{margin-left:auto}.tool:last-child{margin-right:auto}
.tool b{width:38px;height:38px;border-radius:50%;display:block;border:2px solid rgba(255,255,255,.14);
  box-shadow:inset 0 -6px 10px rgba(0,0,0,.28),inset 0 4px 6px rgba(255,255,255,.18);transition:transform .15s}
.tool[aria-pressed="true"]{color:var(--ink);background:var(--dock-hi)}
.tool[aria-pressed="true"] b{border-color:var(--ink);transform:scale(1.08)}

#sheet{position:fixed;inset:0;background:rgba(3,6,18,.66);display:grid;place-items:end center;z-index:5}
#sheet[hidden]{display:none}
.panel{width:min(100%,460px);max-height:86%;overflow:auto;background:var(--dock);border:1px solid var(--line);
  border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;gap:16px}
@media (min-width:620px){#sheet{place-items:center}.panel{border-radius:22px}}
.phead{display:flex;align-items:center;justify-content:space-between}
.mark{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.mark i{font-style:normal;color:var(--glow)}
.lab{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
.namerow{display:flex;gap:8px}
#nameIn{flex:1;min-width:0;font:inherit;font-size:16px;font-weight:600;color:var(--ink);background:var(--space);
  border:1px solid var(--line);border-radius:12px;padding:10px 12px;-webkit-user-select:text;user-select:text}
.btn{background:var(--ink);color:#0a1030;border-radius:12px;padding:10px 16px;font-weight:600}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
#list{display:flex;flex-direction:column;gap:6px}
.w{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;background:var(--space)}
.w img,.w .ph{width:44px;height:44px;border-radius:50%;flex:none;background:#12307a;object-fit:cover}
.w .meta{flex:1;min-width:0}
.w .n{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .d{font-size:12px;color:var(--muted)}
.w button{flex:none;padding:7px 10px;border-radius:10px;font-weight:600;font-size:13px;border:1px solid var(--line)}
.w button.del{color:var(--warn)}
.w .now{flex:none;font-size:12px;color:var(--glow);font-weight:600;padding-inline:6px}
.empty,#note{color:var(--muted);font-size:13px;line-height:1.45}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="stage">
  <canvas id="gl" aria-label="Globe. Paint land onto the ocean."></canvas>
  <div id="ring"></div>
  <div id="top">
    <button class="pill" id="wname" aria-haspopup="dialog" aria-label="World name and saved worlds">
      <span id="wlabel">Untitled world</span>
      <svg width="10" height="6" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 1l4 4 4-4"/></svg>
    </button>
    <div class="acts">
      <div class="seg" role="group" aria-label="One-finger action">
        <button id="mPaint" aria-pressed="true">Paint</button>
        <button id="mSpin" aria-pressed="false">Spin</button>
      </div>
      <button class="pill" id="undo" disabled>Undo</button>
    </div>
  </div>
  <button class="pill" id="bodyBtn"><i></i><span id="bodyLbl">Moon</span></button>
  <button class="pill" id="sndBtn" aria-pressed="true" aria-label="Sound">
    <svg width="18" height="16" viewBox="0 0 18 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6h2.6L8 3v10L4.6 10H2z" fill="currentColor"/><path class="w" d="M11 5.4a3.6 3.6 0 010 5.2M13.4 3.2a6.8 6.8 0 010 9.6"/><path class="x" d="M11.5 5.5l5 5M16.5 5.5l-5 5"/></svg>
  </button>
  <div id="hint"></div>
</div>

<div id="dock">
  <div class="row">
    <div class="seg" role="group" aria-label="Layer">
      <button id="lSurface" aria-pressed="true">Surface</button>
      <button id="lSea" aria-pressed="false">Sea</button>
      <button id="lLife" aria-pressed="false">Animals</button>
      <button id="lNature" aria-pressed="false">Nature</button>
      <button id="lMoon" aria-pressed="false" hidden>Moon paints</button>
      <button id="lSpace" aria-pressed="false" hidden>Space things</button>
    </div>
    <label class="size" for="size"><span>Size</span>
      <input id="size" type="range" min="0" max="100" value="50" aria-label="Brush size">
    </label>
  </div>
  <div class="tools" id="tools" role="group" aria-label="Paints"></div>
</div>

<div id="toast" role="status"></div>
<div id="sheet" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <div class="phead">
      <div class="mark" id="sheetTitle">World<i>brush</i></div>
      <button class="btn ghost" id="sheetClose">Close</button>
    </div>
    <div class="field">
      <label class="lab" for="nameIn">This world</label>
      <div class="namerow">
        <input id="nameIn" type="text" maxlength="40" autocomplete="off" placeholder="Name your world">
        <button class="btn" id="saveBtn">Save</button>
      </div>
    </div>
    <div class="field">
      <div class="lab">Saved worlds</div>
      <div id="list"></div>
    </div>
    <button class="btn ghost" id="newBtn">Start a new world</button>
    <div id="note">Worlds save on this device and keep saving as you paint.</div>
  </div>
</div>

<script>
(function(){
'use strict';
const stage=document.getElementById('stage'), canvas=document.getElementById('gl');
const $=id=>document.getElementById(id);
const gl=canvas.getContext('webgl2',{antialias:true,alpha:true,premultipliedAlpha:false});
function fail(){ const d=document.createElement('div'); d.id='nogl';
  d.textContent='This device could not start 3D graphics. Try opening the page in another browser.';
  stage.appendChild(d); }
if(!gl){ fail(); return; }
const DPR=Math.min(window.devicePixelRatio||1,2);
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- world data: two RGBA maps.
   A: R height, G climate (snow 0 .. tundra .3 .. mild .5 .. desert 1), B trees (forest .5, jungle 1), A fresh water
   B: R volcanic (volcano on land, vents under water), G sea depth (trench 0 .. .5 .. shallows 1), B sea life (kelp 0 .. .5 .. coral 1), A sea ridge ---------- */
const W=2048,H=1024,W4=W*4,PI=Math.PI,HP=PI/2;
let data=new Uint8Array(W*H*4), dataB=new Uint8Array(W*H*4), focus='planet';
function blankA(a){ for(let i=0;i<a.length;i+=4){a[i]=0;a[i+1]=128;a[i+2]=0;a[i+3]=0;} }
function blankB(a){ for(let i=0;i<a.length;i+=4){a[i]=0;a[i+1]=128;a[i+2]=128;a[i+3]=0;} }
blankA(data); blankB(dataB);
const scratch=new Uint8Array(data.length), scratchB=new Uint8Array(data.length);
const cosLat=new Float32Array(H),sinLat=new Float32Array(H),cosLon=new Float32Array(W),sinLon=new Float32Array(W);
for(let y=0;y<H;y++){const a=(y+.5)/H*PI-HP;cosLat[y]=Math.cos(a);sinLat[y]=Math.sin(a);}
for(let x=0;x<W;x++){const a=(x+.5)/W*2*PI-PI;cosLon[x]=Math.cos(a);sinLon[x]=Math.sin(a);}

/* ---------- GL setup ---------- */
function prog(vs,fs){
  const mk=(t,s)=>{ const o=gl.createShader(t); gl.shaderSource(o,'#version 300 es\nprecision highp float;\n'+s); gl.compileShader(o);
    if(!gl.getShaderParameter(o,gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(o)); return o; };
  const p=gl.createProgram(); gl.attachShader(p,mk(gl.VERTEX_SHADER,vs)); gl.attachShader(p,mk(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'pos'); gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  const u={}; const n=gl.getProgramParameter(p,gl.ACTIVE_UNIFORMS);
  for(let i=0;i<n;i++){ const a=gl.getActiveUniform(p,i); u[a.name]=gl.getUniformLocation(p,a.name); }
  return {p,u};
}
const VS=`in vec3 pos; uniform mat3 uRot; uniform mat4 uProj; uniform float uDist; uniform float uScale; uniform vec3 uOff;
  out vec3 vObj; out vec3 vView; out vec3 vN;
  void main(){ vObj=pos; vec3 v=uRot*(pos*uScale)+uOff; v.z-=uDist; vView=v; vN=uRot*pos; gl_Position=uProj*vec4(v,1.0); }`;
const FS_GLOBE=`
  uniform sampler2D map; uniform sampler2D map2; uniform float uSub; uniform float uTime;
  in vec3 vObj; in vec3 vView; in vec3 vN; out vec4 frag;
  const float PI=3.14159265;
  float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
  float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.0-2.0*f);
    return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
  float fbm3(vec3 p){ return noise(p)*.55+noise(p*2.03+3.1)*.3+noise(p*4.1+7.7)*.15; }
  float fbm4(vec3 p){ return noise(p)*.5+noise(p*2.03+3.1)*.27+noise(p*4.1+7.7)*.15+noise(p*8.3+1.3)*.08; }
  float ridged(vec3 p){ return 1.0-abs(2.0*noise(p)-1.0); }
  vec3 bump(vec3 pos, vec3 n, float h){
    vec3 sx=dFdx(pos), sy=dFdy(pos);
    vec3 r1=cross(sy,n), r2=cross(n,sx);
    float det=dot(sx,r1);
    vec3 g=sign(det)*(dFdx(h)*r1+dFdy(h)*r2);
    return normalize(abs(det)*n-g);
  }
  vec4 cubic(float v){ vec4 n=vec4(1.0,2.0,3.0,4.0)-v; vec4 s=n*n*n; float x=s.x; float y=s.y-4.0*s.x; float z=s.z-4.0*s.y+6.0*s.x; float w=6.0-x-y-z; return vec4(x,y,z,w)/6.0; }
  void taps(vec2 uv, out vec4 off, out vec2 k){
    vec2 ts=vec2(2048.0,1024.0); vec2 c=uv*ts-.5; vec2 f=fract(c); c-=f;
    vec4 xc=cubic(f.x), yc=cubic(f.y);
    vec4 cc=c.xxyy+vec2(-.5,1.5).xyxy;
    vec4 sx=vec4(xc.xz+xc.yw,yc.xz+yc.yw);
    off=(cc+vec4(xc.yw,yc.yw)/sx)/ts.xxyy;
    k=vec2(sx.x/(sx.x+sx.y), sx.z/(sx.z+sx.w));
  }
  vec4 smooth4(sampler2D s, vec4 off, vec2 k){
    return mix(mix(textureLod(s,off.yw,0.0),textureLod(s,off.xw,0.0),k.x),mix(textureLod(s,off.yz,0.0),textureLod(s,off.xz,0.0),k.x),k.y);
  }
  void main(){
    vec3 p=normalize(vObj);
    vec2 uv=vec2(atan(p.z,p.x)/(2.0*PI)+.5, asin(clamp(p.y,-1.0,1.0))/PI+.5);
    vec4 off; vec2 kk; taps(uv,off,kk);
    vec4 t=smooth4(map,off,kk), s=smooth4(map2,off,kk);
    float px=length(fwidth(p));
    float na=mix(.5,noise(p*95.0),1.0-smoothstep(.2,.6,px*95.0)), nb=mix(.5,noise(p*230.0),1.0-smoothstep(.2,.6,px*230.0));
    float n1=fbm3(p*5.0), n2=fbm4(p*22.0), n3=na*.6+nb*.4;
    float w1=1.0-smoothstep(.2,.6,px*640.0), w2=1.0-smoothstep(.2,.6,px*1900.0), w3=1.0-smoothstep(.2,.6,px*5600.0);
    float d1=w1>0.0?noise(p*640.0):.5, d2=w2>0.0?noise(p*1900.0+3.7):.5, d3=w3>0.0?noise(p*5600.0+9.1):.5;
    float det=(d1-.5)*w1*.5+(d2-.5)*w2*.32+(d3-.5)*w3*.22;
    float hdet=(d1-.5)*w1*.0007+(d2-.5)*w2*.00026+(d3-.5)*w3*.0001;
    float e=t.r;
    float landv=e+(n1-.5)*.22+(n2-.5)*.10;
    float aa=fwidth(landv)*1.2+.002;
    float land=smoothstep(.33-aa,.33+aa,landv);
    float landF=smoothstep(.33,.42,landv);
    float m=smoothstep(.64,.98,e);
    float ridge=ridged(p*16.0)*.62+ridged(p*39.0+7.0)*.38;
    float lv=ridged(p*36.0+n1*2.5);
    float T=t.g+(n2-.5)*.16;
    float V=t.b+(n2-.5)*.20+(n3-.5)*.08;
    float snow=1.0-smoothstep(.10,.22,T);
    float tundra=(1.0-smoothstep(.36,.46,T))*(1.0-snow);
    float des=smoothstep(.60,.78,T);
    float forest=smoothstep(.19,.33,V);
    float jungle=smoothstep(.68,.86,V);
    float volc=smoothstep(.35,.65,s.r+(n2-.5)*.15);

    /* land */
    vec3 col=mix(vec3(.34,.55,.21),vec3(.53,.67,.28),n2)*(.92+.16*n3);
    col=mix(col,mix(vec3(.06,.25,.13),vec3(.16,.40,.18),n3),forest);
    col=mix(col,mix(vec3(.03,.30,.08),vec3(.26,.62,.14),na)*(.8+.4*nb),jungle);
    vec3 tun=mix(vec3(.44,.45,.33),vec3(.63,.60,.47),n2);
    tun=mix(tun,vec3(.30,.36,.24),smoothstep(.55,.75,na)*.6);
    tun=mix(tun,vec3(.90,.93,.96),smoothstep(.62,.80,nb)*.55);
    col=mix(col,tun,tundra*(1.0-.4*forest));
    col=mix(col,mix(vec3(.87,.71,.43),vec3(.78,.52,.30),n1)*(.93+.12*n3),des);
    col=mix(col,mix(vec3(.85,.90,.96),vec3(.98,.99,1.0),n2),snow);
    float beach=(1.0-smoothstep(.335,.375,landv))*(1.0-snow);
    col=mix(col,vec3(.90,.82,.60),beach*.85);
    col=mix(col,vec3(.17,.15,.14)*(.75+.5*n3),volc*.8);
    float rockAmt=smoothstep(.15,.55,m*(.55+ridge*.7));
    vec3 rock=mix(vec3(.34,.31,.29),vec3(.57,.53,.48),ridge);
    rock=mix(rock,vec3(.64,.41,.28)*(.8+.4*ridge),des*.75);
    rock=mix(rock,mix(vec3(.08,.07,.08),vec3(.24,.20,.19),ridge),volc);
    col=mix(col,rock,rockAmt);
    float cap=smoothstep(.60,.84,m*(.45+ridge*.62))*(1.0-des*.85)*(1.0-volc);
    col=mix(col,vec3(.97,.98,1.0),cap);
    col*=1.0+det*.5;
